<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
  <img src="/images/bg-pattern-top.svg" class="bg-pattern-top" alt="Background Pattern">
  <div class="main-Container">
    <div class="card-Container">
      <div class="cover-Container">
        <img src="/images/bg-pattern-card.svg" alt="bg-pattern-card">
        <div class="profile-Photo-Container">
          <img src="/images/image-victor.jpg" class="profile-Photo" alt="Victor">
        </div>
      </div>
      <div class="profile-Info">
        <p class="profile-Name">Victor Crest</p> 
        <p class="profile-Number">26</p>
        <p class="profile-Country">London</p>
      </div>
      <div class="profile-Stats">
        <p class="stat-Followers"><span>80K</span> Followers</p>
        <p class="stats-Likes"> <span>803K</span> Likes</p>
        <p class="stats-Photos"><span>1.4K</span> Photos</p>
      </div>
    </div>
  </div>

  


  <img src  ="/images/bg-pattern-bottom.svg" class="bg-pattern-bottom" alt="Background Pattern">
  <div class="attribution">
    Challenge by <rel href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</rel>. 
    Coded by <a href="#">ThonyCoder</a>.
  </div>
</body>
</html>
