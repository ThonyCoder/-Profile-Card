<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" text="text/css" href="style.css">
  <title>Profile Card Component</title>
</head>

<body>
  <!--Profile Component Section -->
  <main class="main-Container">
    <section class="card-Component">
      <div class="card-Cover">
          <img src="/images/bg-pattern-card.svg" alt="bg-pattern-card">
        <div class="profile-Photo-Container">
            <img src="/images/image-victor.jpg" class="profile-Photo" alt="Victor">
        </div>
      </div>
      <div class="profile-Info">
        <p class="profile-Name">Victor Crest</p>
        <p class="profile-Number">26</p>
        <p class="profile-Country">London</p>
      </div>      
      <div class="profile-Stats">
          <p class="stats-Followers"><span>80K</span> Followers</p>
          <p class="stats-Likes"> <span>803K</span> Likes</p>
          <p class="stats-Photos"><span>1.4K</span> Photos</p>
      </div>
    </section>
  </main>
  <footer class="attribution">
    <p>
      Challenge by <rel href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</rel>. 
      Coded by <a href="#">ThonyCoder</a>.
    </p>
  </footer>
</body>
</html>
